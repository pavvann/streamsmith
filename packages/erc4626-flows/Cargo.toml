[workspace]

[package]
name = "erc4626-flows"
version = "0.1.0"
edition = "2021"
description = "ERC-4626 deposit/withdraw flows and sampled share-value observations (Base)"
license = "Apache-2.0"
publish = false

[lib]
name = "erc4626_flows"
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
prost = "0.13"
prost-types = "0.13"
ethabi = "18"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"

[build-dependencies]
substreams-ethereum = "0.11"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
